name: Go

on: [push, pull_request]

jobs:

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.24', '1.25', '1.26']
      fail-fast: false
    env:
      OS: ${{ matrix.os }}
      GO: ${{ matrix.go }}
    steps:
      - if: startsWith(matrix.os, 'macos')
        run: |
          brew update
          # The fork bundles SQLCipher with SQLCIPHER_CRYPTO_OPENSSL, so every
          # build links libcrypto. Homebrew openssl@3 is keg-only; expose it
          # to cgo explicitly.
          brew install openssl@3
          echo "CGO_CFLAGS=-I$(brew --prefix openssl@3)/include" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - uses: actions/checkout@v6

      # The fork has no codecov token: go-acc + codecov upload were silent
      # tokenless no-ops, so this runs plain go test.
      - name: 'Tags: default'
        run: go test -count=1 -race -tags ""

      - name: 'Tags: libsqlite3'
        run: go test -count=1 -race -tags "libsqlite3"

      - name: 'Tags: full'
        run: go test -count=1 -race -tags "sqlite_allow_uri_authority sqlite_app_armor sqlite_column_metadata sqlite_foreign_keys sqlite_fts5 sqlite_icu sqlite_introspect sqlite_json sqlite_math_functions sqlite_os_trace sqlite_preupdate_hook sqlite_secure_delete sqlite_see sqlite_stat4 sqlite_trace sqlite_unlock_notify sqlite_vacuum_incr sqlite_vtable"

      - name: 'Tags: vacuum'
        run: go test -count=1 -race -tags "sqlite_vacuum_full"

  test-windows:
    name: Test for Windows
    runs-on: windows-latest
    # Known-red, build-only job: msys2's mingw gcc fails to assemble
    # SQLCipher 4.17's splitmix64 immediates ("value of 0x9e3779b97f4a7c15
    # too large for field of 4 bytes", sqlite3-binding.c). Cross gcc 12/14/15
    # compile the same TU fine. Tracked in the fork issue tracker; remove
    # this when the toolchain or SQLCipher resolves it. Fork consumers are
    # linux/docker.
    continue-on-error: true
    defaults:
      run:
        shell: bash

    strategy:
      matrix:
        go: ['1.24', '1.25', '1.26']
      fail-fast: false
    env:
      OS: windows-latest
      GO: ${{ matrix.go }}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-toolchain mingw-w64-x86_64-sqlite3 mingw-w64-x86_64-openssl
          msystem: MINGW64
          path-type: inherit

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: Add $GOPATH/bin to $PATH
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        shell: msys2 {0}

      - uses: actions/checkout@v6

      - name: 'Tags: default'
        run: go build -race -v -tags ""
        shell: msys2 {0}

      - name: 'Tags: libsqlite3'
        run: go build -race -v -tags "libsqlite3"
        shell: msys2 {0}

      - name: 'Tags: full'
        run: |
          echo 'skip this test'
          echo go build -race -v -tags "sqlite_allow_uri_authority sqlite_app_armor sqlite_column_metadata sqlite_foreign_keys sqlite_fts5 sqlite_icu sqlite_introspect sqlite_json sqlite_math_functions sqlite_preupdate_hook sqlite_secure_delete sqlite_see sqlite_stat4 sqlite_trace sqlite_unlock_notify sqlite_vacuum_incr sqlite_vtable"
        shell: msys2 {0}

      - name: 'Tags: vacuum'
        run: go build -race -v -tags "sqlite_vacuum_full"
        shell: msys2 {0}

  # Advisory freshness check for the bundled SQLCipher amalgamation: reports
  # (without failing CI) when upstream has published a release the fork has
  # not bundled yet. Bump via upgrade/sqlcipher.sh + upgrade/check.sh.
  sqlcipher-freshness:
    name: SQLCipher freshness (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Check bundled SQLCipher version
        run: sh upgrade/check.sh

# based on: github.com/koron-go/_skeleton/.github/workflows/go.yml
